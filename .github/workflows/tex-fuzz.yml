name: TeX adversarial fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
    - cron: "43 3 * * 0"

concurrency:
  group: tex-adversarial-fuzz-${{ github.event.schedule || github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tex-fuzz
      - name: Install LuaLaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Initialize and validate LuaLaTeX oracle
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { runTexOracleDocument, texOracleEnv } from "./scripts/lib/tex-oracle.mjs";
          execFileSync("luaotfload-tool", ["--update"], { env: texOracleEnv(), stdio: "inherit" });
          console.log(runTexOracleDocument({
            engine: "lualatex",
            source: String.raw`\documentclass{article}\begin{document}Oracle ready: $x^2$.\end{document}`,
          }));
          JS
      - name: Shared generator, invariants, coverage, and oracle canary
        run: node scripts/run-tex-fuzz.mjs --cases 10000 --seed ${{ github.run_number }} --profile document --malformed-cases 500 --prefix-base-cases 8 --prefix-limit-per-case 128 --metamorphic-cases 200 --projection-control-cases 128 --supported-cases 128 --supported-max-attempts 16384 --boundary-cases 128 --engine-history-cases 24 --math-oracle-cases 16 --math-oracle-policy diagnostic --oracle-sample-cases 128 --oracle-geometry-policy fail --out artifacts/tex-fuzz/nightly-bundle.json --coverage-out artifacts/tex-fuzz/nightly-coverage.json
      - name: Mandatory math symbol and layout comparisons
        if: ${{ !cancelled() }}
        run: node scripts/check-tex-math-symbols.mjs
      - name: Oracle batching, cache, timeout, and isolation tests
        run: TEX_FUZZ_ORACLE_TESTS=1 npx vitest run test/tex-fuzz-kernel.spec.ts test/tex-fuzz-oracle-hardening.spec.ts test/tex-fuzz-paragraph-oracle.spec.ts test/tex-fuzz-math-oracle.spec.ts
      - name: Math differential diagnostic sample
        continue-on-error: true
        run: |
          mkdir -p artifacts/tex-fuzz
          node scripts/compare-tex-math.mjs --math-fuzz 80 --seed ${{ github.run_number }} --summary-only | tee artifacts/tex-fuzz/math-differential.json
      - name: Inline differential diagnostic sample
        continue-on-error: true
        run: node scripts/compare-tex-inline-math-paragraph.mjs --fuzz 40 --seed ${{ github.run_number }} --formula-mode mixed --widths 80,120,160 --summary-only --oracle-cache-dir artifacts/tex-fuzz/inline-oracle-cache
      - name: Display differential diagnostic sample
        continue-on-error: true
        run: node scripts/compare-tex-display-math.mjs --display-fuzz 40 --seed ${{ github.run_number }} --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tex-fuzz-nightly-${{ github.run_id }}
          path: artifacts/tex-fuzz
          if-no-files-found: warn
          retention-days: 14

  weekly-soak:
    if: github.event.schedule == '43 3 * * 0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tex-fuzz
      - name: Aggressive valid soak
        run: node scripts/run-tex-fuzz.mjs --cases 30000 --seed ${{ github.run_number }} --profile aggressive --no-oracle --malformed-cases 2000 --prefix-base-cases 16 --prefix-limit-per-case 256 --metamorphic-cases 500 --projection-control-cases 256 --supported-cases 256 --supported-max-attempts 32768 --boundary-cases 256 --engine-history-cases 32 --out artifacts/tex-fuzz/soak-valid-bundle.json --coverage-out artifacts/tex-fuzz/soak-valid-coverage.json
      - name: Malformed typing-state soak
        run: node scripts/run-tex-fuzz.mjs --cases 10000 --seed 20290713 --profile malformed --no-oracle --prefix-base-cases 16 --prefix-limit-per-case 256 --metamorphic-cases 200 --out artifacts/tex-fuzz/soak-malformed-bundle.json --coverage-out artifacts/tex-fuzz/soak-malformed-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tex-fuzz-soak-${{ github.run_id }}
          path: artifacts/tex-fuzz
          if-no-files-found: warn
          retention-days: 30

  beamer-differential:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Beamer oracle and raster tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-pictures dvisvgm librsvg2-bin imagemagick poppler-utils mupdf-tools
          if ! command -v magick >/dev/null; then
            # ImageMagick 6 exposes convert/compare as separate commands.
            mkdir -p "$RUNNER_TEMP/beamer-bin"
            cat > "$RUNNER_TEMP/beamer-bin/magick" <<'SH'
          #!/bin/sh
          if [ "$1" = compare ]; then
            shift
            exec compare "$@"
          fi
          exec convert "$@"
          SH
            chmod +x "$RUNNER_TEMP/beamer-bin/magick"
            echo "$RUNNER_TEMP/beamer-bin" >> "$GITHUB_PATH"
          fi
          luaotfload-tool --update
      - run: npm run build
      - name: Seeded Beamer, TikZ and overlay differential comparisons
        run: npm run compare:beamer-fuzz -- --cases 45 --seed ${{ github.run_number }} --out-dir artifacts/beamer-fuzz/nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beamer-fuzz-${{ github.run_id }}
          path: artifacts/beamer-fuzz
          if-no-files-found: error
          retention-days: 14

  beamer-edit-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/beamer-edit-corpus
          key: beamer-edit-corpus-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: beamer-edit-corpus-${{ runner.os }}-v1-
      - name: Isolated Beamer edit fuzz with measured coverage feedback
        id: campaign
        run: |
          edit_cases=49
          edit_steps=28
          if [ '${{ github.event.schedule }}' = '43 3 * * 0' ]; then
            edit_cases=64
            edit_steps=96
          fi
          npm run fuzz:beamer-edits -- --cases "$edit_cases" --steps "$edit_steps" --seed ${{ github.run_number }} --corpus-replays 8 --mutations 16 --max-failures 3 --out-dir artifacts/beamer-edit-fuzz/ci
      - uses: actions/cache/save@v4
        if: ${{ always() && (steps.campaign.outcome == 'success' || steps.campaign.outcome == 'failure') }}
        with:
          path: artifacts/beamer-edit-corpus
          key: beamer-edit-corpus-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beamer-edit-feedback-${{ github.run_id }}
          path: |
            artifacts/beamer-edit-fuzz
            artifacts/beamer-edit-corpus
          if-no-files-found: warn
          retention-days: 30
