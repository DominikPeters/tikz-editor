name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.paths.outputs.checks }}
      unit: ${{ steps.paths.outputs.unit }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
      images: ${{ steps.paths.outputs.images }}
      landing: ${{ steps.paths.outputs.landing }}
      ipad: ${{ steps.paths.outputs.ipad }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: paths
        run: node scripts/ci-changes.mjs

  image-fidelity:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    uses: ./.github/workflows/image-fidelity.yml

  pdf-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      PLAYWRIGHT_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real PDF.js image editing, history and reload
        run: npm run test:e2e -- beamer-pdf-image.spec.ts --workers=1 --reporter=line,json
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/pdf-browser-${{ matrix.browser }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/pdf-browser-${{ matrix.browser }}/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-browser-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pdf-browser-${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 14

  grammar:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated grammar is committed
        run: |
          npm run generate:grammar
          git diff --exit-code -- packages/lezer-tex/src/grammar/ packages/lezer-tikz/src/grammar/

  lint:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ci

  typecheck:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  fuzz-smoke:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deterministic adversarial TeX fuzz smoke
        run: npm run fuzz:tex-adversarial:pr

  test:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
        env:
          # Every frame of the pointer-invariant fuzzer; local runs take a quick subset.
          POINTER_FUZZ_FULL: "1"
      - run: npm run -w @tikz-editor/desktop test:e2e:mock

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/web-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/web-results
          if-no-files-found: ignore

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:landing
        env:
          GH_TOKEN: ${{ github.token }}

  ipad:
    name: iPad frontend
    needs: changes
    if: needs.changes.outputs.ipad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w @tikz-editor/ipad typecheck
      - run: npm run -w @tikz-editor/ipad build

  desktop-macos:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - name: Build isolated app with embedded WebDriver
        run: npm run -w @tikz-editor/desktop tauri:build:e2e -- --ci
      - name: Run macOS desktop end-to-end tests
        run: npm run test:desktop:e2e
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-failure
          path: ${{ runner.temp }}/tikz-desktop-e2e-failure.png
          if-no-files-found: ignore

  desktop-linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-driver-v1-
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - run: npm ci
      - run: cargo install tauri-driver --locked
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
      - run: npm run -w @tikz-editor/desktop tauri:build -- --no-bundle
      - run: xvfb-run -a npm run test:desktop:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-linux-failure
          path: ${{ runner.temp }}/tikz-desktop*.png
          if-no-files-found: ignore

  desktop-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: ${{ runner.os }}-tauri-driver-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-driver-v1-
      - run: npm ci
      - name: Build unsigned Windows installers
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "tauri-ci.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $config
          npm run -w @tikz-editor/desktop tauri:build -- --ci --bundles nsis,msi --config $config
      - name: Test Windows native code
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib
      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - name: Ensure WebView2 Runtime is installed
        shell: pwsh
        run: |
          $client = "Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $roots = @("HKLM:\SOFTWARE\WOW6432Node", "HKLM:\SOFTWARE", "HKCU:\SOFTWARE\WOW6432Node", "HKCU:\SOFTWARE")
          $installed = $roots | ForEach-Object {
            Get-ItemPropertyValue -LiteralPath (Join-Path $_ $client) -Name pv -ErrorAction SilentlyContinue
          } | Where-Object { $_ -and $_ -ne "0.0.0.0" }
          if (-not $installed) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
            $install = Start-Process -FilePath $bootstrapper -ArgumentList "/silent", "/install" -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 installation failed: $($install.ExitCode)" }
          }
      - name: Install matching Microsoft Edge Driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { throw "Could not install msedgedriver-tool." }
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          if ($LASTEXITCODE -ne 0) { throw "Could not download Microsoft Edge Driver." }
          $PWD.Path >> $env:GITHUB_PATH
      - name: Run Windows desktop end-to-end tests
        timeout-minutes: 10
        run: npm run test:desktop:e2e
      - name: Build portable Windows executable
        run: npm run -w @tikz-editor/desktop tauri:build:portable -- --ci
      - name: Package portable ZIP
        shell: pwsh
        run: ./apps/desktop/scripts/package-portable.ps1 -OutputDirectory "$env:RUNNER_TEMP\portable-output"
      - name: Test relocated portable app and profile persistence
        timeout-minutes: 10
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "Portable Apps With Spaces"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Get-ChildItem (Join-Path $env:RUNNER_TEMP "portable-output\*-portable.zip")
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $directory
          $env:TIKZ_DESKTOP_E2E_APP_PATH = Join-Path $directory "tikz-editor.exe"
          $env:TIKZ_DESKTOP_E2E_PORTABLE = "1"
          # Launch without WebDriver first: EdgeDriver overrides the app's own
          # profile setting, so verify the release binary's storage independently.
          $portableProfilePath = Join-Path $directory "tikz-editor-data\EBWebView"
          $app = Start-Process -FilePath $env:TIKZ_DESKTOP_E2E_APP_PATH -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              $app.Refresh()
              if ($app.HasExited) { throw "Portable app exited before the profile check: $($app.ExitCode)" }
              if ((Test-Path -LiteralPath $portableProfilePath -PathType Container) -and $app.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $portableProfilePath -PathType Container)) {
              throw "Portable app did not create its WebView2 profile at $portableProfilePath"
            }
            Write-Host "Portable app created its profile without WebDriver: $portableProfilePath"
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(10000)) {
                taskkill /PID $app.Id /T /F
                if ($LASTEXITCODE -ne 0) { throw "Could not stop the portable launch probe." }
              }
            }
          }
          npm run test:desktop:e2e
      - name: Upload unsigned Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-ci-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            ${{ runner.temp }}/portable-output/*-portable.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-windows-failure
          path: ${{ runner.temp }}/tikz-desktop*.png
          if-no-files-found: ignore

  result:
    name: CI result
    if: always()
    needs: [changes, grammar, lint, typecheck, fuzz-smoke, test, web, pdf-browser, landing, ipad, image-fidelity, desktop-macos, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            await core.summary.addTable([
              [{data: 'Job', header: true}, {data: 'Result', header: true}],
              ...Object.entries(jobs).map(([name, job]) => [name, job.result]),
            ]).write();
            const failures = Object.entries(jobs).filter(([, job]) => !['success', 'skipped'].includes(job.result));
            if (jobs.changes.result !== 'success' || failures.length) {
              core.setFailed(`CI jobs did not pass: ${failures.map(([name, job]) => `${name}=${job.result}`).join(', ')}`);
            }
