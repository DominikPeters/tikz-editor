name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated grammar is committed
        run: |
          npm run generate:grammar
          git diff --exit-code packages/lezer-tikz/src/grammar/
      - name: Lint and typecheck
        run: |
          npm run lint:ci
          npm run typecheck
      - run: npm test
      - run: npm run -w @tikz-editor/desktop test:e2e:mock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-driver-v1-
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - run: npm ci
      - run: cargo install tauri-driver --locked
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
      - run: npm run -w @tikz-editor/desktop tauri:build -- --no-bundle
      - run: xvfb-run -a npm run test:desktop:e2e
