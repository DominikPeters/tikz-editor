name: Release desktop

on:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Sign Windows executables and installers with SignPath
        type: boolean
        default: false
      signpath_test_only:
        description: Build and test-sign Windows bundles without creating a release
        type: boolean
        default: false

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ !inputs.signpath_test_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse the release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
            const tag = `app-v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const matching = releases.filter(release => release.tag_name === tag);
            if (matching.length > 1) {
              throw new Error(`Multiple releases exist for ${tag}; consolidate them before retrying.`);
            }
            let release = matching[0];
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `TikZ Editor v${version}`,
                body: 'See the assets to download this version and install.',
                draft: true,
                prerelease: false,
              }));
            }
            core.setOutput('id', release.id);
            core.setOutput('tag', tag);

  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/private_keys"
          printf "%s" "$APPLE_API_PRIVATE_KEY" > "$GITHUB_WORKSPACE/private_keys/AuthKey_${APPLE_API_KEY}.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          includeUpdaterJson: false

  build-windows:
    needs: prepare-release
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows bundles with optional SignPath signing
        id: sign
        uses: ./.github/actions/build-sign-windows
        with:
          signpath-enabled: ${{ inputs.sign_windows }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tikz-editor
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-signing
          wait-for-completion-timeout-in-seconds: "3600"
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          ARTIFACT_DIRECTORY: ${{ steps.sign.outputs.artifact-directory }}
        run: |
          Get-ChildItem -Path $env:ARTIFACT_DIRECTORY -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $($_.Name) to release $env:RELEASE_TAG."
            }
          }

  test-signpath-windows:
    if: ${{ inputs.signpath_test_only }}
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build and test-sign Windows bundles
        id: sign
        uses: ./.github/actions/build-sign-windows
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tikz-editor
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-signing
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload test-signed Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: test-signed-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.sign.outputs.artifact-directory }}
          compression-level: 0
          if-no-files-found: error

  publish-updater-manifest:
    needs: [prepare-release, build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release metadata and updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p updater-manifest updater-signatures
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > updater-manifest/release.json
          gh release download "$RELEASE_TAG" \
            --pattern '*.sig' \
            --dir updater-signatures \
            --clobber

      - name: Build complete updater manifest
        run: |
          node scripts/build-desktop-updater-manifest.mjs \
            updater-manifest/release.json updater-signatures updater-manifest/latest.json

      - name: Re-upload completed updater manifest to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            updater-manifest/latest.json \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Upload updater manifest to FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file updater-manifest/latest.json \
            "ftp://w008ef9a.kasserver.com:21/editor/latest.json"
