name: Release desktop

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/private_keys"
          printf "%s" "$APPLE_API_PRIVATE_KEY" > "$GITHUB_WORKSPACE/private_keys/AuthKey_${APPLE_API_KEY}.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: app-v__VERSION__
          releaseName: TikZ Editor v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false

  build-windows:
    needs: build
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and release-sign Windows bundles
        id: sign
        uses: ./.github/actions/build-sign-windows
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tikz-editor
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-signing
          wait-for-completion-timeout-in-seconds: "3600"
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload signed Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_ARTIFACT_DIRECTORY: ${{ steps.sign.outputs.signed-artifact-directory }}
        run: |
          $version = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tag = "app-v$version"
          Get-ChildItem -Path $env:SIGNED_ARTIFACT_DIRECTORY -File | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $($_.Name) to release $tag."
            }
          }

      - name: Create Windows updater manifest fragment
        shell: pwsh
        env:
          SIGNED_ARTIFACT_DIRECTORY: ${{ steps.sign.outputs.signed-artifact-directory }}
        run: |
          $version = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tag = "app-v$version"
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $msi = @(Get-ChildItem -Path $env:SIGNED_ARTIFACT_DIRECTORY -Filter "*.msi")
          $nsis = @(Get-ChildItem -Path $env:SIGNED_ARTIFACT_DIRECTORY -Filter "*.exe")
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one signed MSI and one signed NSIS installer."
          }

          $msiEntry = @{
            signature = (Get-Content -LiteralPath "$($msi[0].FullName).sig" -Raw).Trim()
            url = "$baseUrl/$($msi[0].Name)"
          }
          $nsisEntry = @{
            signature = (Get-Content -LiteralPath "$($nsis[0].FullName).sig" -Raw).Trim()
            url = "$baseUrl/$($nsis[0].Name)"
          }
          $fragment = @{
            platforms = @{
              "windows-x86_64" = $msiEntry
              "windows-x86_64-msi" = $msiEntry
              "windows-x86_64-nsis" = $nsisEntry
            }
          }
          New-Item -ItemType Directory -Force -Path "windows-updater" | Out-Null
          $fragment | ConvertTo-Json -Depth 5 | Set-Content -Path "windows-updater/windows.json" -Encoding utf8

      - name: Upload Windows updater manifest fragment
        uses: actions/upload-artifact@v7
        with:
          name: windows-updater-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-updater/windows.json
          if-no-files-found: error

  publish-updater-manifest:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve release tag
        run: |
          VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          echo "tag=app-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download generated updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updater-manifest
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern latest.json \
            --dir updater-manifest \
            --clobber

      - name: Download Windows updater manifest fragment
        uses: actions/download-artifact@v8
        with:
          name: windows-updater-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-updater

      - name: Add signed Windows artifacts to updater manifest
        run: |
          jq --slurpfile windows windows-updater/windows.json \
            '.platforms += $windows[0].platforms' \
            updater-manifest/latest.json > updater-manifest/latest.signed.json
          mv updater-manifest/latest.signed.json updater-manifest/latest.json

      - name: Re-upload completed updater manifest to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            updater-manifest/latest.json \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --latest

      - name: Upload updater manifest to FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file updater-manifest/latest.json \
            "ftp://w008ef9a.kasserver.com:21/editor/latest.json"
