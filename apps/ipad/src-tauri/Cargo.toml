[package]
name = "tikz-editor-ipad"
version = "0.2.0"
description = "TikZ Editor for iPad"
authors = ["Dominik Peters"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tikz_editor_ipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.4"

[target.'cfg(target_os = "ios")'.dependencies]
base64 = "0.22"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSString", "NSURL"] }

# Wry 0.55.1 unconditionally uses a private WKPreferences PiP key.
# Keep the iOS-only correction reproducible; see vendor/wry/LOCAL-PATCH.md.
[patch.crates-io]
wry = { path = "vendor/wry" }
